<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disney旅ノート</title>
<style>
:root{--accent:#c995a6;--bg:#fbf6f0}*{box-sizing:border-box}body{font-family:-apple-system,sans-serif;max-width:680px;margin:auto;padding:16px;background:var(--bg);color:#594d4b}h1{text-align:center;font-size:24px}section{background:white;padding:15px;border-radius:16px;margin:12px 0}button,input,textarea{font:inherit;padding:10px;border:1px solid #e5d8d4;border-radius:10px;margin:3px}button{background:white;color:#594d4b}button.active{background:var(--accent);color:white}input,textarea{width:100%;margin:5px 0}textarea{min-height:65px}.row{display:flex;flex-wrap:wrap;gap:5px}.row button{flex:1}
</style>
</head>
<body>
<h1>𖧷 Disney 旅ノート 𖧷</h1>
<p style="text-align:center">遠方組の思いを馳せるインパプラン</p>
<section><b>テーマカラー</b><div class="row"><button onclick="theme('#c995a6','#fbf6f0')">淡色ピンク</button><button onclick="theme('#b69a7d','#f8f2e8')">ベージュ</button><button onclick="theme('#8eafc0','#f0f6f8')">ブルー</button><button onclick="theme('#94ad9a','#f1f6f0')">グリーン</button></div></section>
<section><div id="days" class="row"></div><button onclick="addDay()">＋ 日程を追加</button><label>日程名</label><input id="dayname" onchange="current().name=this.value;save();drawDays()"><b>行き先</b><div class="row"><button onclick="setPlace('🏰 ランド')">🏰 ランド</button><button onclick="setPlace('🌎 シー')">🌎 シー</button><button onclick="setPlace('🏨 ホテル')">🏨 ホテル</button><button onclick="setPlace('🚃 移動')">🚃 移動</button></div><p id="place"></p><label>日付</label><input id="date" placeholder="例：2027年12月10日" oninput="current().date=this.value;save()"><label>メモ</label><textarea id="memo" placeholder="予約・やりたいことなど" oninput="current().memo=this.value;save()"></textarea></section>
<section><h3>⏰ 時間割</h3><div id="plans"></div><button onclick="addPlan()">＋ 予定を追加</button></section>
<section><h3>🎒 準備リスト</h3><div id="items"></div><div class="row"><input id="newitem" placeholder="持ち物を追加"><button onclick="addItem()">追加</button></div></section>
<script>
const KEY='disney-note-v3';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!data.days)data={days:[day('1日目'),day('2日目')],current:0,items:[{text:'チケット',done:false},{text:'モバイルバッテリー',done:false},{text:'子どもの着替え',done:false}]};
function day(name){return{name,place:'🏰 ランド',date:'',memo:'',plans:[{time:'08:00',text:'到着・入園'}]}}function current(){return data.days[data.current]}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function theme(a,b){document.documentElement.style.setProperty('--accent',a);document.documentElement.style.setProperty('--bg',b)}function drawDays(){let d=document.getElementById('days');d.innerHTML='';data.days.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x.name;b.className=i===data.current?'active':'';b.onclick=()=>{data.current=i;draw()};d.append(b)})}function draw(){drawDays();let d=current();document.getElementById('dayname').value=d.name;document.getElementById('place').textContent=d.place;document.getElementById('date').value=d.date;document.getElementById('memo').value=d.memo;let p=document.getElementById('plans');p.innerHTML='';d.plans.forEach((x,i)=>{let t=document.createElement('input');t.placeholder='時間';t.value=x.time;t.oninput=()=>{x.time=t.value;save()};let v=document.createElement('input');v.placeholder='予定';v.value=x.text;v.oninput=()=>{x.text=v.value;save()};let del=document.createElement('button');del.textContent='削除';del.onclick=()=>{d.plans.splice(i,1);save();draw()};p.append(t,v,del)});let items=document.getElementById('items');items.innerHTML='';data.items.forEach((x,i)=>{let line=document.createElement('div');let cb=document.createElement('input');cb.type='checkbox';cb.checked=x.done;cb.style.width='auto';cb.onchange=()=>{x.done=cb.checked;save()};let span=document.createElement('span');span.textContent=x.text;let del=document.createElement('button');del.textContent='×';del.onclick=()=>{data.items.splice(i,1);save();draw()};line.append(cb,span,del);items.append(line)});save()}function addDay(){data.days.push(day((data.days.length+1)+'日目'));data.current=data.days.length-1;draw()}function setPlace(p){current().place=p;draw()}function addPlan(){current().plans.push({time:'',text:''});draw()}function addItem(){let n=document.getElementById('newitem'),v=n.value.trim();if(v){data.items.push({text:v,done:false});n.value='';save();draw()}}draw();
</script>
</body>
</html>
